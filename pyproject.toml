[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-digital-twin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "mesa==2.3.4",              # pinned: 3.x changed the Agent/scheduler API
    "stable-baselines3==2.9.0",
    "gymnasium==1.3.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pillow>=10.0",             # validation/combine_calibration.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.setuptools]
packages = ["ingestion", "simulation", "policy", "validation"]